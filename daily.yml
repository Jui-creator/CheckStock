name: 飆股雷達每日自動掃描

on:
  # 只保留手動觸發：到 Actions 頁面點「Run workflow」執行。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feigu-radar-daily
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      - name: 還原產業鏈快取
        uses: actions/cache/restore@v4
        with:
          path: ic_sector_cache.json
          key: ic-sector-${{ github.run_id }}
          restore-keys: |
            ic-sector-

      - name: 執行飆股雷達
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u radar.py

      - name: 儲存產業鏈快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ic_sector_cache.json
          key: ic-sector-${{ github.run_id }}

      # 只 commit stock_states.json。
      # 【v26】push 前先 pull --rebase，避免和左側潛力庫的 commit 衝突而推送失敗。
      - name: 儲存狀態回 repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_states.json || true
          git diff --staged --quiet && exit 0
          git commit -m "更新飆股雷達狀態 $(date '+%Y-%m-%d')"
          git pull --rebase || true
          git push || true

      - name: 上傳 CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-report
          path: |
            watchlist_snapshot.csv
            signals_today.csv
          if-no-files-found: ignore
