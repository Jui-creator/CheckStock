name: 補歷史 / 重跑選池（A1 追蹤 / A2 池 / B 池 → initial_pools.json）
on:
  # 手動到 Actions 頁面點「Run workflow」。不使用 schedule，也不需要 Apps Script 觸發。
  # 兩種用法（三個勾選框最多勾一個）：
  #   A. 上線時一次性補歷史：什麼都不勾（signal_history.json 已有內容時會中止，要勾 force 才會「只新增不存在的代號」）。
  #      用日 K 往回重播 → 補好 signal_history.json → 接著選池產生 initial_pools.json。耗時約 55～70 分鐘。
  #   B. 規則改了、想讓明天就生效：只勾 rescan_only。
  #      不重播、不補標的、不改追蹤清單；只用現在的 signal_history.json 重新選池，覆寫 initial_pools.json。
  #      前提：radar 當天 13:35 已經結算過（signal_history.json 的結算日 = 最新交易日），否則會中止。耗時約 50～60 分鐘，會再發一則【盤後運算】。
  # 跑完會把 signal_history.json、initial_pools.json、backfill_report.csv（只有用法 A 才有）commit 回 repo。
  # 不要和 daily.yml 同時跑：兩者都會寫 signal_history.json / initial_pools.json，所以共用同一個 concurrency 群組，會自動排隊。
  workflow_dispatch:
    inputs:
      rescan_only:
        description: "只重跑選池（規則更新後讓明天生效；不重播、不補標的、不改追蹤清單）"
        required: false
        default: false
        type: boolean
      force:
        description: "【補歷史用】signal_history.json 已有內容時仍要執行（只新增不存在的代號，不覆蓋既有資料）；只重跑選池時不用勾"
        required: false
        default: false
        type: boolean
      no_scan:
        description: "【補歷史用】只補 signal_history.json，不做選池；只重跑選池時不用勾"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: feigu-radar-daily
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件與富邦 SDK
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp
          pip install vendor/fubon_neo-*.whl
      # 選池會補查族群標籤（有 30 天快取；補查上限 60 秒，補不到的下次 radar 再補）
      - name: 還原產業鏈快取
        uses: actions/cache/restore@v4
        with:
          path: ic_sector_cache.json
          key: ic-sector-${{ github.run_id }}
          restore-keys: |
            ic-sector-
      - name: 還原憑證
        run: echo "${{ secrets.FUBON_CERT_B64 }}" | base64 -d > fubon.p12
      - name: 補歷史 / 重跑選池
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUBON_ID: ${{ secrets.FUBON_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_CERT_PASS: ${{ secrets.FUBON_CERT_PASS }}
          BACKFILL_RESCAN_ONLY: ${{ github.event.inputs.rescan_only }}
          BACKFILL_FORCE: ${{ github.event.inputs.force }}
          BACKFILL_NO_SCAN: ${{ github.event.inputs.no_scan }}
        run: |
          python -u backfill_history.py
      - name: 刪除憑證
        if: always()
        run: rm -f fubon.p12
      - name: 儲存產業鏈快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ic_sector_cache.json
          key: ic-sector-${{ github.run_id }}
      # initial_pools.json 沒 commit 成功 = 明天沒有候選池，所以 push 失敗要讓這一步失敗（會觸發下面的失敗通知）
      - name: 儲存結果回 repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in signal_history.json initial_pools.json backfill_report.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "補歷史 / 重跑選池 $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 第 $i 次失敗，5 秒後重試"
            sleep 5
          done
          exit 1
      - name: 上傳報表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-report
          path: |
            backfill_report.csv
            signal_history.json
            initial_pools.json
          if-no-files-found: ignore
      - name: 失敗通知
        if: failure() || cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "沒有設定 Telegram Secrets，略過通知"
            exit 0
          fi
          TEXT=$(printf '❌ 【飆股雷達】%s 執行失敗、逾時或被取消\n時間：%s\n請查看：%s' \
            "$WORKFLOW_NAME" "$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" "$RUN_URL")
          curl -sS -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" > /dev/null || echo "Telegram 通知送出失敗"
