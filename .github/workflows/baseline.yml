name: 法人資料（外資・投信近 5 日買賣超）
on:
  # 不設定排程（不使用 schedule/cron）。只由 Google Apps Script 的時間驅動觸發器在每個交易日傍晚（18:00 之後）以 workflow_dispatch 觸發，
  # 也可到 Actions 頁面點「Run workflow」手動執行。
  # 檔名維持 baseline.yml，Apps Script 不用改（workflow 的顯示名稱改了沒關係）。
  #
  # v70 起這條 workflow 只做一件事：抓證交所（T86）＋櫃買的官方三大法人買賣超，算出外資、投信近 5 個交易日淨買賣超，
  # 寫成 institutional.json 並 commit 回 repo；隔天早上 radar 盤前讀取，貼到 A1 通知的法人燈號。
  # A1 / A2 / B 選池、分時量矩陣、指數基準、產業鏈都已經搬到 radar（收盤後 13:35 起），這裡不再做。
  # 為什麼法人要等傍晚：官方日報傍晚才公布，收盤後 13:35 還拿不到。
  #
  # 耗時：通常 1～2 分鐘；官方 T 日資料還沒出來時，每個市場最多再等 4 × 3 分鐘（INST_RETRIES × INST_RETRY_WAIT），所以上限約 25 分鐘。
  # 重複觸發保護：institutional.json 已經是這個交易日（T 日）而且上市、上櫃都取得時，重複觸發（例如 Apps Script 重試）會直接結束；
  #               要強制重跑（例如第一次時官方資料還沒出來、有 ❌），手動執行時勾選 force。
  workflow_dispatch:
    inputs:
      force:
        description: "強制重跑（忽略「institutional.json 已經是今天」的重複觸發保護）"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: volume-baseline
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # baseline 仍要登入富邦：查最近交易日、官方法人抓不到時用 institutional_trades 補 B 池標的
      - name: 檢查 SDK 檔案
        run: |
          ls -la vendor/
          ls vendor/fubon_neo-*.whl
      - name: 安裝套件與富邦 SDK
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp
          pip install vendor/fubon_neo-*.whl
      - name: 還原憑證
        run: echo "${{ secrets.FUBON_CERT_B64 }}" | base64 -d > fubon.p12
      - name: 抓取官方法人資料
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUBON_ID: ${{ secrets.FUBON_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_CERT_PASS: ${{ secrets.FUBON_CERT_PASS }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python -u baseline.py
      - name: 刪除憑證
        if: always()
        run: rm -f fubon.p12
      # 只 commit institutional.json（signal_history.json、initial_pools.json 現在由 daily.yml 的 radar 負責，這裡不碰，避免互相衝突）。
      # push 前先 pull --rebase --autostash，並重試 3 次；3 次都失敗才算失敗。
      - name: 儲存法人資料回 repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in institutional.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "更新法人資料 $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 第 $i 次失敗，5 秒後重試"
            sleep 5
          done
          exit 1
      # 任何一步失敗、逾時或被取消，都發 Telegram（Secrets 沒設定時只略過，不影響結果）
      - name: 失敗通知
        if: failure() || cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "沒有設定 Telegram Secrets，略過通知"
            exit 0
          fi
          TEXT=$(printf '❌ 【飆股雷達】%s 執行失敗、逾時或被取消\n時間：%s\n請查看：%s' \
            "$WORKFLOW_NAME" "$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" "$RUN_URL")
          curl -sS -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" > /dev/null || echo "Telegram 通知送出失敗"
