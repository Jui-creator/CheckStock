name: 夜間運算（日K・R矩陣・法人・B候選）
on:
  # 不設定排程（不使用 schedule/cron）。只由 Google Apps Script 的時間驅動觸發器在每個交易日傍晚觸發（建議 18:00 之後），
  # 也可到 Actions 頁面點「Run workflow」手動執行。
  # v68 產出三個檔案，一起 commit 回 repo：
  #   stock_bases.json      歷史基底（富邦日 K：均線、5 日均量、B 型態候選、A2 整理期標記、法人近 5 日）
  #   volume_baseline.json  分時累積佔比 R 矩陣（富邦 1 分 K：近 20 日中位數，與全市場曲線 70:30 混合）
  #   initial_pools.json    B 池夜間候選（KD<40 金叉 + 爆量 + 型態 + 法人 T 日合計淨買賣超 ≥ 0）
  # 耗時：日 K 約 13 分鐘；1 分 K 約 13 分鐘（若富邦一次回傳不完整，程式會自動改成 5 日一段，約 54 分鐘）；
  #       官方法人 T 日資料還沒出來時最多再等 4 × 3 分鐘。以上都是依限速推估，第一次執行請看實際耗時。
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: volume-baseline
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 檢查 SDK 檔案
        run: |
          ls -la vendor/
          ls vendor/fubon_neo-*.whl
      - name: 安裝套件與富邦 SDK
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp
          pip install vendor/fubon_neo-*.whl
      - name: 還原產業鏈快取
        uses: actions/cache/restore@v4
        with:
          path: ic_sector_cache.json
          key: ic-sector-${{ github.run_id }}
          restore-keys: |
            ic-sector-
      - name: 還原憑證
        run: echo "${{ secrets.FUBON_CERT_B64 }}" | base64 -d > fubon.p12
      - name: 夜間運算
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUBON_ID: ${{ secrets.FUBON_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_CERT_PASS: ${{ secrets.FUBON_CERT_PASS }}
        run: |
          python -u baseline.py
      - name: 刪除憑證
        if: always()
        run: rm -f fubon.p12
      - name: 儲存產業鏈快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ic_sector_cache.json
          key: ic-sector-${{ github.run_id }}
      # 基準檔 commit 回 repo，隔天雷達（daily.yml）checkout 後讀取。
      # push 前先 pull --rebase --autostash，並重試 3 次，避免和雷達的 commit 衝突；3 次都失敗才算失敗。
      - name: 儲存夜間運算結果回 repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add volume_baseline.json stock_bases.json initial_pools.json
          git diff --staged --quiet && exit 0
          git commit -m "更新夜間運算 $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 第 $i 次失敗，5 秒後重試"
            sleep 5
          done
          exit 1
      # 任何一步失敗、逾時或被取消，都發 Telegram（Secrets 沒設定時只略過，不影響結果）
      - name: 失敗通知
        if: failure() || cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "沒有設定 Telegram Secrets，略過通知"
            exit 0
          fi
          TEXT=$(printf '❌ 【飆股雷達】%s 執行失敗、逾時或被取消\n時間：%s\n請查看：%s' \
            "$WORKFLOW_NAME" "$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" "$RUN_URL")
          curl -sS -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" > /dev/null || echo "Telegram 通知送出失敗"
