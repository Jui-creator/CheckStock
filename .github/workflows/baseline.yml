name: 夜間運算（日K・分時量矩陣・法人・A1/A2/B 候選池）
on:
  # 不設定排程（不使用 schedule/cron）。只由 Google Apps Script 的時間驅動觸發器在每個交易日傍晚（18:00 之後）以 workflow_dispatch 觸發，
  # 也可到 Actions 頁面點「Run workflow」手動執行。
  # v69 產出兩個檔案，一起 commit 回 repo：
  #   initial_pools.json   隔日盤中唯一使用的靜態資料（A1 候選池、A2 追蹤池、B 候選池、分時量矩陣 volume_time_matrix、
  #                        兩個市場的前 19 日指數收盤、法人參考、候選股的均線 / 均量基底）。原子寫入，資料不完整時不覆寫前一版。
  #   signal_history.json  追蹤清單（A1 收盤確認 → A2 追蹤池、B 池等待日數）。radar 13:35 沒結算成功時，這裡用官方日 K 補結算。
  # 耗時：日 K 約 13 分鐘；1 分 K 只抓候選股（約 3～10 分鐘；若富邦一次回傳不完整，程式會自動改成 5 日一段，約 4 倍）；
  #       官方法人 T 日資料還沒出來時最多再等 4 × 3 分鐘。以上都是依限速推估，第一次執行請看實際耗時。
  # 重複觸發保護：今天已經成功產出同一基準日的 initial_pools.json 時，重複觸發（例如 Apps Script 重試）會直接結束；
  #               要強制重跑，手動執行時勾選 force。
  workflow_dispatch:
    inputs:
      force:
        description: "強制重跑（忽略「今天已成功產出」的重複觸發保護）"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: volume-baseline
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 檢查 SDK 檔案
        run: |
          ls -la vendor/
          ls vendor/fubon_neo-*.whl
      - name: 安裝套件與富邦 SDK
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp
          pip install vendor/fubon_neo-*.whl
      - name: 還原產業鏈快取
        uses: actions/cache/restore@v4
        with:
          path: ic_sector_cache.json
          key: ic-sector-${{ github.run_id }}
          restore-keys: |
            ic-sector-
      - name: 還原憑證
        run: echo "${{ secrets.FUBON_CERT_B64 }}" | base64 -d > fubon.p12
      - name: 夜間運算
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUBON_ID: ${{ secrets.FUBON_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_CERT_PASS: ${{ secrets.FUBON_CERT_PASS }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python -u baseline.py
      - name: 刪除憑證
        if: always()
        run: rm -f fubon.p12
      - name: 儲存產業鏈快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ic_sector_cache.json
          key: ic-sector-${{ github.run_id }}
      # 夜間結果 commit 回 repo，隔天雷達（daily.yml）checkout 後讀取。
      # push 前先 pull --rebase --autostash，並重試 3 次，避免和雷達的 commit 衝突；3 次都失敗才算失敗。
      - name: 儲存夜間運算結果回 repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in initial_pools.json signal_history.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "更新夜間運算 $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 第 $i 次失敗，5 秒後重試"
            sleep 5
          done
          exit 1
      # 任何一步失敗、逾時或被取消，都發 Telegram（Secrets 沒設定時只略過，不影響結果）
      - name: 失敗通知
        if: failure() || cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "沒有設定 Telegram Secrets，略過通知"
            exit 0
          fi
          TEXT=$(printf '❌ 【飆股雷達】%s 執行失敗、逾時或被取消\n時間：%s\n請查看：%s' \
            "$WORKFLOW_NAME" "$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" "$RUN_URL")
          curl -sS -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" > /dev/null || echo "Telegram 通知送出失敗"
