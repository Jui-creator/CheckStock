name: 同期量基準盤後計算
on:
  # 每個交易日收盤後（建議 17:00 以後）執行一次；可由 Google Apps Script 在 18:00~19:00 觸發，
  # 也可到 Actions 頁面點「Run workflow」手動執行。第一次使用請先手動跑一次。
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: volume-baseline
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 檢查 SDK 檔案
        run: |
          ls -la vendor/
          ls vendor/fubon_neo-*.whl
      - name: 安裝套件與富邦 SDK
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp
          pip install vendor/fubon_neo-*.whl
      - name: 還原憑證
        run: echo "${{ secrets.FUBON_CERT_B64 }}" | base64 -d > fubon.p12
      - name: 計算同期量基準
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUBON_ID: ${{ secrets.FUBON_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_CERT_PASS: ${{ secrets.FUBON_CERT_PASS }}
        run: |
          python -u baseline.py
      - name: 刪除憑證
        if: always()
        run: rm -f fubon.p12
      # 基準檔 commit 回 repo，隔天雷達（daily.yml）checkout 後讀取。
      - name: 儲存基準回 repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add volume_baseline.json
          git diff --staged --quiet && exit 0
          git commit -m "更新同期量基準 $(date '+%Y-%m-%d')"
          git pull --rebase
          git push
